server:
  name: Paid Trading Community
  description: Paid community with free members, premium members, alerts, education, support, and disclaimers.
  preferredTone: professional
  communityType: Finance/trading community
  defaultLocale: en-US
roles:
  - name: Owner
    color: "#FEE75C"
    hoist: true
    mentionable: false
    permissions: [Administrator]
    managedByBot: true
  - name: Admin
    color: "#ED4245"
    hoist: true
    mentionable: false
    permissions: [ManageGuild, ManageRoles, ManageChannels, ManageMessages, ManageWebhooks]
    managedByBot: true
  - name: Moderator
    color: "#EB459E"
    hoist: true
    mentionable: false
    permissions: [ManageMessages, ModerateMembers, KickMembers, BanMembers]
    managedByBot: true
  - name: Staff
    color: "#5865F2"
    hoist: true
    mentionable: false
    permissions: [ManageMessages]
    managedByBot: true
  - name: Analyst
    color: "#3498DB"
    hoist: true
    mentionable: true
    permissions: []
    managedByBot: true
  - name: Premium Member
    color: "#F1C40F"
    hoist: false
    mentionable: true
    permissions: []
    managedByBot: true
  - name: Trial Member
    color: "#E67E22"
    hoist: false
    mentionable: false
    permissions: []
    managedByBot: true
  - name: Verified Member
    color: "#57F287"
    hoist: false
    mentionable: false
    permissions: []
    managedByBot: true
  - name: Member
    color: "#99AAB5"
    hoist: false
    mentionable: false
    permissions: []
    managedByBot: true
  - name: Muted
    color: "#2F3136"
    hoist: false
    mentionable: false
    permissions: []
    managedByBot: true
categories:
  - name: START HERE
    permissions:
      - role: "@everyone"
        allow: [ViewChannel, ReadMessageHistory]
        deny: []
    channels:
      - name: welcome
        type: text
        topic: Welcome and overview.
      - name: rules
        type: text
        topic: Server rules.
        starterMessages:
          - title: Server Rules
            body: |-
              1. Be respectful.
              2. No harassment, hate speech, threats, or spam.
              3. No impersonation.
              4. No illegal content.
              5. No sharing private information.
              6. Keep conversations in the correct channels.
              7. Follow staff instructions.
              8. Violations may lead to warnings, mutes, kicks, or bans.
            pin: true
      - name: disclaimers
        type: text
        topic: Risk and compliance disclaimer.
        starterMessages:
          - title: Important Disclaimer
            body: Content is educational and informational only. No message guarantees profit, prevents loss, or replaces licensed financial advice. Follow local laws, age requirements, and platform terms before acting.
            pin: true
      - name: verify
        type: text
        topic: Verification instructions.
  - name: ANNOUNCEMENTS
    permissions:
      - role: Verified Member
        allow: [ViewChannel, ReadMessageHistory]
        deny: [SendMessages]
    channels:
      - name: announcements
        type: announcement
        topic: Official announcements.
      - name: updates
        type: text
        topic: Community updates.
  - name: MARKET EDUCATION
    permissions:
      - role: Verified Member
        allow: [ViewChannel, ReadMessageHistory, SendMessages]
        deny: []
    channels:
      - name: education
        type: text
        topic: Educational market discussion.
      - name: alerts
        type: announcement
        topic: Informational alerts only.
      - name: risk-management
        type: text
        topic: Risk management and process.
  - name: COMMUNITY
    permissions:
      - role: Verified Member
        allow: [ViewChannel, ReadMessageHistory, SendMessages]
        deny: []
    channels:
      - name: general
        type: text
        topic: General discussion.
      - name: questions
        type: text
        topic: Member questions.
      - name: introductions
        type: text
        topic: Introductions.
  - name: SUPPORT
    permissions:
      - role: Verified Member
        allow: [ViewChannel, ReadMessageHistory, SendMessages]
        deny: []
    channels:
      - name: support
        type: text
        topic: Support requests.
  - name: PREMIUM
    permissions:
      - role: "@everyone"
        allow: []
        deny: [ViewChannel]
      - role: Trial Member
        allow: [ViewChannel, ReadMessageHistory, SendMessages]
        deny: []
      - role: Premium Member
        allow: [ViewChannel, ReadMessageHistory, SendMessages]
        deny: []
      - role: Staff
        allow: [ViewChannel, ReadMessageHistory, SendMessages]
        deny: []
    channels:
      - name: premium-info
        type: text
        topic: Premium access details.
      - name: premium-chat
        type: text
        topic: Premium member discussion.
      - name: premium-resources
        type: text
        topic: Premium educational resources.
  - name: STAFF
    permissions:
      - role: "@everyone"
        allow: []
        deny: [ViewChannel]
      - role: Staff
        allow: [ViewChannel, ReadMessageHistory, SendMessages]
        deny: []
      - role: Moderator
        allow: [ViewChannel, ReadMessageHistory, SendMessages, ManageMessages]
        deny: []
      - role: Admin
        allow: [ViewChannel, ReadMessageHistory, SendMessages, ManageChannels]
        deny: []
    channels:
      - name: staff-chat
        type: text
        topic: Staff discussion.
      - name: moderation-log
        type: text
        topic: Moderation log.
      - name: admin-notes
        type: text
        topic: Admin notes.
automod:
  enabled: true
  rules:
    - name: Block invite links
      type: invite_links
      keywords: ["discord.gg/*", "discord.com/invite/*"]
      action: block
      exemptRoles: [Owner, Admin, Moderator, Staff]
      logChannel: moderation-log
    - name: Block misleading guarantee claims
      type: keyword
      keywords: ["guaranteed profit", "risk-free investment", "sure win", "100% guaranteed"]
      action: block
      exemptRoles: [Owner, Admin, Moderator, Staff, Analyst]
      logChannel: moderation-log
onboarding:
  enabled: true
  welcomeMessage: Welcome to the paid community. Read the disclaimer before posting.
  questions:
    - title: What access do you need?
      type: multi_select
      options:
        - label: Free Member
          role: Verified Member
          channels: [general, education, support]
        - label: Premium Member
          role: Premium Member
          channels: [premium-chat, premium-resources, alerts]
features:
  starterMessages: true
  webhooks: false
  automod: true
  onboarding: true
  supportTickets: true
  premiumRoles: true
  announcementChannels: true
