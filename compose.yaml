name: promptguild

services:
  promptguild:
    build:
      context: .
    image: promptguild:latest
    container_name: promptguild
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PROMPTGUILD_PORT:-5194}:5194"
    environment:
      ENV_FILE: /data/.env
    volumes:
      - promptguild-data:/data
      - promptguild-generated:/app/blueprints/generated
      - promptguild-templates:/app/blueprints/templates
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  promptguild-data:
  promptguild-generated:
  promptguild-templates:
