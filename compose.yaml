services:
  discordforge:
    build:
      context: .
    image: discordforge:latest
    container_name: discordforge
    restart: unless-stopped
    ports:
      - "127.0.0.1:${DISCORDFORGE_PORT:-5194}:5194"
    environment:
      ENV_FILE: /data/.env
    volumes:
      - discordforge-data:/data
      - discordforge-generated:/app/blueprints/generated
      - discordforge-templates:/app/blueprints/templates
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  discordforge-data:
  discordforge-generated:
  discordforge-templates:
